<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="60%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  <!-- Background with safe zone -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  
  <!-- Outer Glow Circle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#f87171" stroke-width="8" opacity="0.4" />
  
  <!-- Retro Microphone Silhouette -->
  <!-- Capsule body -->
  <rect x="206" y="130" width="100" height="150" rx="50" fill="url(#gold)" />
  <!-- Capsule grill lines -->
  <line x1="220" y1="170" x2="292" y2="170" stroke="#78350f" stroke-width="6" stroke-linecap="round" />
  <line x1="220" y1="200" x2="292" y2="200" stroke="#78350f" stroke-width="6" stroke-linecap="round" />
  <line x1="220" y1="230" x2="292" y2="230" stroke="#78350f" stroke-width="6" stroke-linecap="round" />
  <line x1="256" y1="145" x2="256" y2="255" stroke="#78350f" stroke-width="6" stroke-linecap="round" />

  <!-- Stand arc -->
  <path d="M 176 220 A 80 80 0 0 0 336 220" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" />
  <!-- Stand base -->
  <line x1="256" y1="300" x2="256" y2="370" stroke="#ffffff" stroke-width="18" stroke-linecap="round" />
  <rect x="186" y="370" width="140" height="24" rx="12" fill="#ffffff" />
  
  <!-- "ON AIR" badge -->
  <rect x="181" y="420" width="150" height="40" rx="10" fill="#dc2626" stroke="#fecaca" stroke-width="3" />
  <text x="256" y="447" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="20" text-anchor="middle" letter-spacing="3">ON AIR</text>
</svg>
