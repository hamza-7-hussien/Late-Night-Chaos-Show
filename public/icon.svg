<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="40%" stop-color="#881337" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="neonRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="goldMic" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>

  <!-- Background with safe rounded corners -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Neon Broadcast Studio Lights Backdrop -->
  <circle cx="256" cy="230" r="170" fill="none" stroke="#f43f5e" stroke-width="4" opacity="0.3" stroke-dasharray="16 10" />
  <circle cx="256" cy="230" r="140" fill="none" stroke="#fbbf24" stroke-width="6" opacity="0.4" />

  <!-- Late Night City Silhouette Skyline -->
  <path d="M 60 410 L 100 370 L 120 370 L 130 340 L 160 340 L 170 380 L 210 380 L 220 320 L 240 320 L 250 280 L 262 280 L 272 320 L 300 320 L 310 360 L 350 360 L 360 330 L 390 330 L 400 380 L 452 410 Z" fill="#0f172a" opacity="0.85" />

  <!-- Retro Late Night Show Microphone -->
  <!-- Capsule Body -->
  <rect x="211" y="120" width="90" height="135" rx="45" fill="url(#goldMic)" />
  <!-- Capsule Grille Lines -->
  <line x1="225" y1="155" x2="287" y2="155" stroke="#78350f" stroke-width="5" stroke-linecap="round" />
  <line x1="225" y1="180" x2="287" y2="180" stroke="#78350f" stroke-width="5" stroke-linecap="round" />
  <line x1="225" y1="205" x2="287" y2="205" stroke="#78350f" stroke-width="5" stroke-linecap="round" />
  <line x1="256" y1="135" x2="256" y2="235" stroke="#78350f" stroke-width="5" stroke-linecap="round" />

  <!-- Stand Arc -->
  <path d="M 184 200 A 72 72 0 0 0 328 200" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" />
  <!-- Stand Pole -->
  <line x1="256" y1="272" x2="256" y2="340" stroke="#ffffff" stroke-width="16" stroke-linecap="round" />
  <!-- Stand Base -->
  <rect x="196" y="340" width="120" height="20" rx="10" fill="#ffffff" />

  <!-- "LATE SHOW" Neon Badge -->
  <rect x="126" y="380" width="260" height="64" rx="20" fill="url(#neonRed)" stroke="#fecdd3" stroke-width="3" />
  <text x="256" y="423" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="28" text-anchor="middle" letter-spacing="4">LATE SHOW</text>
</svg>
